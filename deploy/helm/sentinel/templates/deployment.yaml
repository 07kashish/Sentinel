apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}, app.kubernetes.io/name: sentinel}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}, app.kubernetes.io/name: sentinel}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: {{ .Release.Name }}}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: {{ .Release.Name }}}}
      containers:
        - name: sentinel
          image: "{{ .Values.image.repository }}{{- if .Values.image.digest }}@{{ .Values.image.digest }}{{- else }}:{{ .Values.image.tag }}{{- end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000, protocol: TCP}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            # SENTINEL_ENV IS THE ONLY VARIABLE THE APPLICATION READS.
            #
            # This line used to be `SENTINEL_MODE: live`. Nothing in `sentinel/`
            # has ever read SENTINEL_MODE -- `Settings.from_environment` reads
            # SENTINEL_ENV and defaults it to "development". So this manifest
            # set a variable with no reader and left the real one unset, and
            # every deployment from it ran with DEVELOPMENT safeguards.
            #
            # Demonstrated by feeding this manifest's exact environment to
            # Settings: environment="development", is_production=False, and a
            # five-character API key was ACCEPTED against a production floor of
            # 32. Also silently permitted: SQLite, allow-all CORS, a per-replica
            # rate limiter with no Redis, and unauthenticated /docs.
            #
            # `production` is not a label here. It is what switches those checks
            # on, and `Settings` REFUSES TO START if any of them is unsatisfied.
            - {name: SENTINEL_ENV, value: production}
            - {name: SENTINEL_PROTECT_ENFORCE, value: "true"}
            - {name: GUNICORN_WORKERS, value: "1"}
            - name: SENTINEL_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.existingSecret }}
                  key: {{ .Values.redis.secretKey }}
            {{- /*
              WHAT PRODUCTION DEMANDS, SUPPLIED.

              Setting SENTINEL_ENV=production without these is what produced a
              crash-looping pod and `Available: 0/1` in CI: Settings refused to
              start, correctly, because a manifest had been switched to
              production without being given the configuration production
              requires. Turning the checks on and not satisfying them is only
              half the fix.

              `required` on corsOrigins fails at RENDER time with a readable
              message, rather than at pod start with CrashLoopBackOff and a
              reason only visible in `kubectl logs`.
            */}}
            - name: SENTINEL_CORS_ORIGINS
              value: {{ required "corsOrigins is required: SENTINEL_ENV=production refuses a wildcard CORS origin on a credentialed API. Set corsOrigins to the exact browser origins that may call this API." .Values.corsOrigins | quote }}
            - {name: SENTINEL_RATE_LIMIT_FAIL_OPEN, value: {{ .Values.rateLimitFailOpen | quote }}}
            - {name: SENTINEL_REQUIRE_EXECUTION_BINDING, value: {{ .Values.requireExecutionBinding | quote }}}
            - name: SENTINEL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: {{ .Values.postgres.secretKey }}
            - name: SENTINEL_DATA_KEY_{{ .Values.evidenceEncryption.keyId | upper }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.evidenceEncryption.existingSecret }}
                  key: {{ .Values.evidenceEncryption.secretKey }}
            - {name: SENTINEL_ACTIVE_KEY_ID, value: {{ .Values.evidenceEncryption.keyId | quote }}}
            - name: SENTINEL_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.secretKey }}
            - {name: SENTINEL_RETENTION_DAYS, value: "{{ .Values.retentionDays }}"}
            - {name: SENTINEL_RETENTION_INTERVAL, value: "{{ .Values.maintenance.retentionIntervalSeconds }}"}
            {{- /*
              Emitted ONLY when set. An empty-string env var would be parsed as
              "unset" by Settings and so would behave correctly either way, but
              rendering `SENTINEL_INCIDENT_RETENTION_DAYS: ""` into the manifest
              makes it look configured to anyone reading `kubectl describe pod`.
              A compliance switch must not look switched on when it is off.
            */}}
            {{- if .Values.incidentRetentionDays }}
            - {name: SENTINEL_INCIDENT_RETENTION_DAYS, value: "{{ .Values.incidentRetentionDays }}"}
            {{- end }}
            - {name: SENTINEL_METRICS_TOKEN_FILE, value: /var/run/secrets/sentinel-metrics/token}
            - {name: SENTINEL_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/live, port: http, scheme: HTTP}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http, scheme: HTTP}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http, scheme: HTTP}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: metrics-token, mountPath: /var/run/secrets/sentinel-metrics, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: metrics-token
          secret:
            secretName: {{ .Values.metrics.existingSecret }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.metrics.secretKey }}, path: token}
