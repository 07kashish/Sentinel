{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector: {matchLabels: {app: {{ .Release.Name }}}}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  podSelector: {matchLabels: {app: {{ .Release.Name }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-egress
spec:
  podSelector: {matchLabels: {app: {{ .Release.Name }}}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.postgresPodLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.redisPodLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 6379}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }}
          podSelector:
            matchLabels: {{ toYaml .Values.networkPolicy.otelPodLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 4318}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.egressProxy.namespace }}
          podSelector:
            matchLabels: {{ toYaml .Values.egressProxy.podLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.egressProxy.port }}}
{{- end }}
