global:
  scrape_interval: 15s
# Alerting rules live beside this file. Loading them is what turns
# sentinel_detection_degraded and sentinel_possible_bypass_agents from numbers
# on a dashboard into something that wakes somebody up.
rule_files:
  - /etc/prometheus/alerts/*.yml
scrape_configs:
  - job_name: sentinel
    metrics_path: /metrics/prometheus
    # The metrics endpoint requires a viewer token; Sentinel exposes no
    # unauthenticated data surface, including to its own scraper.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/sentinel_token
    static_configs:
      - targets: ["sentinel:8000"]
