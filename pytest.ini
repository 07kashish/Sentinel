[pytest]
testpaths = tests_arch
python_files = test_*.py
addopts = -q
markers =
    slow: initialises real database clusters or replays WAL; tens of seconds each.
filterwarnings =
    error::DeprecationWarning
    # Third-party alias deprecation emitted by starlette's TestClient import on
    # newer anyio. It is not this codebase's deprecation, and escalating it made
    # 23 modules fail to COLLECT on a fresh interpreter, which hid every real
    # result behind an environment quirk.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
