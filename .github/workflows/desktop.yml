name: Windows (desktop app and local trial)
# Two things are proven here on a real Windows machine, because nothing else in
# this repository's CI runs on Windows and the developer has no Windows PC:
#
#   app    -- the "Sentinel AI Scan" .exe is built, passes its packaged
#             self-test, and its REAL WINDOW is opened, the boxes ticked, Scan
#             pressed and what the window then shows recorded (`--smoke-gui`).
#             An earlier check looked for the window title on the started
#             process and always failed: a one-file build's first process is a
#             bootstrap that owns no window.
#   trial  -- the product itself runs on Windows the way TRY_SENTINEL.md tells a
#             tester to run it: install, migrate, serve, scan THIS Windows
#             machine, import the report, load the sample story, read it back.
#
# PyInstaller cannot cross-build, so the .exe is built here; the macOS app is
# built on a Mac by `scripts/build_desktop_app.py` and NOT here, because macOS
# minutes are billed at ten times the Linux rate against a 2,000-minute
# allowance. Windows minutes are billed at twice the Linux rate, so this runs
# ONLY when asked for, or when a pull request changes the files it exercises.
#
# The .exe is UNSIGNED: SmartScreen will warn until the owner signs it with
# their own certificate. What this does NOT show: a person clicking through the
# window, or the scanner's folder list checked against real installed AI tools
# (a hosted runner has none of them installed).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - sentinel/sdk/discovery.py
      - sentinel/sdk/discovery_app.py
      - scripts/build_desktop_app.py
      - scripts/try_sentinel.py
      - scripts/seed_console_demo.py
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: app
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install the packager (pinned)
        run: python -m pip install --disable-pip-version-check pyinstaller==6.11.1
      - name: Build, self-test, and smoke-test the real window
        run: python scripts/build_desktop_app.py
      - name: What the window showed on Windows
        shell: pwsh
        run: Get-Content dist/desktop/gui-smoke-windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-AI-Scan-Windows
          path: dist/desktop/
          if-no-files-found: error
          retention-days: 30

  trial:
    name: local trial
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Install the way TRY_SENTINEL.md says
        run: python -m pip install --disable-pip-version-check -e ".[server]"
      - name: The scanner on this Windows machine
        shell: pwsh
        run: |
          python sentinel/sdk/discovery.py --explain | Select-Object -Last 3
          python sentinel/sdk/discovery.py --consent --all --output device.json --html device.html
          python -c "import json; r=json.load(open('device.json')); s=[o['state'] for o in r['observations']]; print(r['platform'], len(s), 'checks;', {k: s.count(k) for k in sorted(set(s))}); assert r['platform']=='Windows' and 'unsupported' not in s and 'inaccessible' not in s, s"
      - name: Start, scan, import, load the sample story, read it back
        run: python scripts/try_sentinel.py --scan --demo --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-trial-device-report
          path: |
            device.json
            device.html
          retention-days: 14
